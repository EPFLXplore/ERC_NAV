      use_sim_time: false


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/xplore/dev_ws/src/navigation/path_planning/saved_maps/2026/marsyard_costmap.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5000.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # Switched to SmacPlanner2D because global costmap has no inflation/obstacle layers.
    # This avoids the Hybrid-A* SE2 warning path that expects inflation for optimization.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 800
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0 # 2.0 is great, 0.0 is classic A* without cost
      use_final_approach_orientation: false
      smoother:
          # max_iterations: bounds maximum computation time by limiting smoothing passes
          max_iterations: 1000
          # w_smooth: higher values smooth the path more aggressively (creates rounder curves)
          w_smooth: 0.5
          # w_data: higher values keep the path closer to the original A* output (less smoothing)
          w_data: 0.5
          # tolerance: convergence threshold; lower values allow more smoothing iterations before stopping
          tolerance: 1.0e-10
          # do_refinement: applies extra refinement smoothing passes for macro-trend smoothing
          do_refinement: true
          # refinement_num: number of recursive smoothing cycles (higher = smoother but slower)
          refinement_num: 2

      # Previous Hybrid-A* settings kept for reference:
      # plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # motion_model_for_search: "REEDS_SHEPP"
      # angle_quantization_bins: 18
      # analytic_expansion_ratio: 1.2
      # analytic_expansion_max_length: 3.0
      # analytic_expansion_max_cost: 200.0
      # analytic_expansion_max_cost_override: true
      # minimum_turning_radius: 0.15
      # reverse_penalty: 1.0
      # change_penalty: 0.0
      # non_straight_penalty: 1.0
      # retrospective_penalty: 0.015
      # lookup_table_size: 5.0
      # cache_obstacle_heuristic: true
      # debug_visualizations: false
      # use_quadratic_cost_penalty: false
      # downsample_obstacle_heuristic: true
      # allow_primitive_interpolation: false
      # smooth_path: true
      
      # plugin: "nav2_navfn_planner/NavfnPlanner"
      # use_astar: True
      # allow_unknown: False
      # tolerance: 0.05
      # use_final_approach_orientation: True

      #not working
      # plugin: "nav2_theta_star_planner/ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      # how_many_corners: 8
      # w_euc_cost: 0.0000001
      # w_traversal_cost: 1000000.0

