waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 8
    global_frame_id: 'map'
    # global_frame_id: 'odom'
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 20000
      #^10 seconds pause (milliseconds)

velocity_smoother:
