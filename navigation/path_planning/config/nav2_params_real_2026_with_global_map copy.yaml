      #   enabled: true
      #   combination_method: 1
      #   publish_voxel_map: true
      #   footprint_clearing_enabled: true
      #   origin_z: 0.1
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.5
      #   mark_threshold: 0
      #   observation_sources: ouster_pcl
      #   ouster_pcl:
      #     sensor_frame: Lidar_v2_1
      #     topic: /ouster/points
      #     sensor_data_qos: true
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     min_obstacle_height: -0.08
      #     max_obstacle_height: 2.0
      #     raytrace_max_range: 5.0
      #     raytrace_min_range: 0.75
      #     obstacle_max_range: 5.0
      #     obstacle_min_range: 0.75
      # denoise_layer:
      #   plugin: "nav2_costmap_2d::DenoiseLayer"
      #   enabled: true
      #   minimal_group_size: 4
      #   group_connectivity_type: 8

      # gradient_layer:
      #   plugin: "gradient_layer::GradientLayer"
      #   enabled: true
      #   topic: "/occupancy_map_local_inflated"
      #   # topic: "/occupancy_map_local"
      always_send_full_costmap: true

  global_costmap_client:
