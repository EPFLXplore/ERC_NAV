local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      # global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.72
      plugins: ["gradient_layer"]
      
      # Live occupancy cost comes from traversability_map (gradient_costmap/launch/gradient_costmap.launch.py):
      # local_* inflation/sigmoid + neighbor_search_radius_m, slope_angle_limit_deg, roughness_norm_m, min_neighbor_points.
      gradient_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: true
        topic: "/occupancy_map_local_inflated"
        map_subscribe_transient_local: true
        map_subscribe_reliable: true
        expand_update_bounds: false

      always_send_full_costmap: true

  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      # global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      # robot_radius: 0.7
      robot_radius: 0.4
      resolution: 0.1
      track_unknown_space: true
      static_map: true
      rolling_window: false
      width: 80
      height: 80
      origin_x: -40.0
      origin_y: -40.0
      # plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      # plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer", "gradient_layer"]
      # plugins: ["static_layer", "gradient_layer"]
      # Current setup: global costmap is loaded from saved RAW map file through custom gradient layer,
      # not from StaticLayer and not from a live topic.
      plugins: ["gradient_layer", "live_local_patch_layer"]
      # plugins: ["gradient_layer"]
      #Keep this order : gradient layer then live local patch layer otherwise the blank map will overlay it
      gradient_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: true #false
        use_map_file: true
        map_yaml_filename: "/home/xplore/dev_ws/src/navigation/path_planning/saved_maps/2026/marsyard_costmap_inflated.yaml"
        map_flip_x: false
        map_flip_y: true

      # BEWARE, adding this live local patch layer means that local change will affect the global costmap and we leave the obstacle once they're out of sight. So if a obstacle is removed, the cost where the obstacle was needs to be rewritten. 
      # So the local costmap rewrite the global map until the rover see again the same thing.
      live_local_patch_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: false
        use_map_file: false
        topic: "/occupancy_map_local_inflated"
        map_subscribe_transient_local: true
        map_subscribe_reliable: true
        expand_update_bounds: true
        transform_tolerance: 0.5

        persistent_patch: true
        persistence_timeout: 8.0
        persistence_min_cost: 1

      # live_gradient_layer:
      #   plugin: "gradient_layer::GradientLayer"
      #   enabled: true
      #   topic: "/occupancy_map_local_inflated"
      #   map_subscribe_transient_local: true
