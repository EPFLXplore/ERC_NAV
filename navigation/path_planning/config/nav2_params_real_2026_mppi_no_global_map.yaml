local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      # global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Conservative octagonal approximation of the previous 0.72 m radius.
      # Coordinates are metres in base_link (x forward, y left).
      # Keep synchronized with ROVER_FOOTPRINT_XY in gradient_costmap.launch.py;
      # that producer-side copy includes the 0.02 m padding below.
      footprint: "[[0.72, 0.298], [0.298, 0.72], [-0.298, 0.72], [-0.72, 0.298], [-0.72, -0.298], [-0.298, -0.72], [0.298, -0.72], [0.72, -0.298]]"
      footprint_padding: 0.02
      plugins: ["gradient_layer", "inflation_layer"]
      
      # Live occupancy cost comes from traversability_map (gradient_costmap/launch/gradient_costmap.launch.py):
      # local_* inflation/sigmoid + neighbor_search_radius_m, slope_angle_limit_deg, roughness_norm_m, min_neighbor_points.
      gradient_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: true
        topic: "/occupancy_map_local_inflated"
        map_subscribe_transient_local: true
        map_subscribe_reliable: true
        # Required so this base data layer updates the full rolling window.
        expand_update_bounds: true
        footprint_clearing_enabled: true

      # MPPI's footprint-aware CostCritic requires a standard InflationLayer to
      # derive the circumscribed-cost threshold used for its fast collision
      # check. The custom gradient map is already producer-inflated, so keep
      # this additional decay steep. 0.85 m remains above the approximately
      # 0.81 m circumscribed radius of the padded footprint.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 15.0
        inflation_radius: 0.85

      always_send_full_costmap: true

  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      # global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      # robot_radius: 0.7
      robot_radius: 0.72 #only use with inflation layer
      resolution: 0.1
      track_unknown_space: true
      static_map: true
      rolling_window: false
      width: 80
      height: 80
      origin_x: -40.0
      origin_y: -40.0
      # plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      # plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer", "gradient_layer"]
      # plugins: ["static_layer", "gradient_layer"]
      # Current setup: global costmap is loaded from saved RAW map file through custom gradient layer,
      # not from StaticLayer and not from a live topic.
      plugins: ["gradient_layer", "live_local_patch_layer"]
      # plugins: ["gradient_layer"]
      #Keep this order : gradient layer then live local patch layer otherwise the blank map will overlay it
      gradient_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: true #false
        use_map_file: true
        map_yaml_filename: "/home/xplore/dev_ws/src/navigation/path_planning/saved_maps/2026/blank_100m.yaml"
        map_flip_x: false
        map_flip_y: true

      # inflation_layer: #we use it to take into account the rover radius when computing the global path
      #   plugin: "nav2_costmap_2d::InflationLayer"
      #   enabled: true
      #   cost_scaling_factor: 1.0
      #   inflation_radius: 0.72 #0.72/2

      # BEWARE, adding this live local patch layer means that local change will affect the global costmap and we leave the obstacle once they're out of sight. So if a obstacle is removed, the cost where the obstacle was needs to be rewritten. 
      # So the local costmap rewrite the global map until the rover see again the same thing.
      live_local_patch_layer:
        plugin: "gradient_layer::GradientLayer"
        enabled: true
        use_map_file: false
        topic: "/occupancy_map_local_inflated"
        map_subscribe_transient_local: true
        map_subscribe_reliable: true
        expand_update_bounds: true
        transform_tolerance: 0.5

        # This layer runs after the file-backed global layer, so it forces the
        # current robot footprint to zero in the combined global costmap.
        footprint_clearing_enabled: true

        # The file-backed gradient_layer above writes the whole saved map. Without
        # this, a cell the live producer reports as free keeps the saved map's
        # cost, because a zero only clears cells this layer previously wrote.
        # That is what makes the stale map show through inside the cleared
        # footprint ring. Live free space wins inside the local grid's extent.
        authoritative_clear: true

        persistent_patch: true
        persistence_timeout: 8.0
        persistence_min_cost: 1

      # live_gradient_layer:
      #   plugin: "gradient_layer::GradientLayer"
      #   enabled: true
      #   topic: "/occupancy_map_local_inflated"
      #   map_subscribe_transient_local: true
      #   map_subscribe_reliable: true
      #   expand_update_bounds: false
      # inflation_layer:
      #   plugin: "nav2_costmap_2d::InflationLayer"
      #   cost_scaling_factor: 15.0
      #   inflation_radius: 2.0
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   transform_tolerance: 1.5
      #   enabled: true
      #   combination_method: 1
      #   publish_voxel_map: true
      #   footprint_clearing_enabled: true
      #   origin_z: 0.1
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.5
      #   mark_threshold: 0
      #   observation_sources: ouster_pcl
      #   ouster_pcl:
      #     sensor_frame: Lidar_v2_1
      #     topic: /ouster/points
      #     sensor_data_qos: true
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     min_obstacle_height: -0.08
      #     max_obstacle_height: 2.0
      #     raytrace_max_range: 5.0
      #     raytrace_min_range: 0.75
      #     obstacle_max_range: 5.0
      #     obstacle_min_range: 0.75
      # denoise_layer:
      #   plugin: "nav2_costmap_2d::DenoiseLayer"
      #   enabled: true
      #   minimal_group_size: 4
      #   group_connectivity_type: 8

      # gradient_layer:
      #   plugin: "gradient_layer::GradientLayer"
      #   enabled: true
      #   topic: "/occupancy_map_local_inflated"
      #   # topic: "/occupancy_map_local"
      always_send_full_costmap: true

  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/xplore/dev_ws/src/navigation/path_planning/saved_maps/2026/blank_100m.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5000.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # SmacPlanner2D plans collision-aware XY paths without imposing an Ackermann
    # turning radius. The rover may then use its in-place rotation capability,
    # while MPPI remains Ackermann to avoid DiffDrive controller oscillations.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.05
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 800
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0 # 2.0 is great, 0.0 is classic A* without cost
      use_final_approach_orientation: false
      smoother:
          # max_iterations: bounds maximum computation time by limiting smoothing passes
          max_iterations: 1000
          # w_smooth: higher values smooth the path more aggressively (creates rounder curves)
          w_smooth: 0.5
          # w_data: higher values keep the path closer to the original A* output (less smoothing)
          w_data: 0.5
          # tolerance: convergence threshold; lower values allow more smoothing iterations before stopping
