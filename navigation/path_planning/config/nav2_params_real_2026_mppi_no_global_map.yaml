bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    # global_frame: odom
    robot_base_frame: base_link
    odom_topic: fused_nav_ekf_odom
    bt_loop_duration: 100
    default_server_timeout: 20
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    #/fused_nav_ekf_odom is the output from the local EKF

    # add custom behaviour tree (BT) to validate path and keep a correct one
    default_nav_to_pose_bt_xml: "/home/xplore/dev_ws/src/navigation/path_planning/behavior_trees/stable_replanning.xml"

    # Tunables for the custom AcceptCandidatePath BT node (stable_replanning.xml).
    # Keep the followed path unless the candidate is clear and meaningfully
    # improves obstacle cost, mean cost, or rover-relative heading error.
    accept_candidate_path:
      check_distance: 1.5             # [m] look-ahead used to calculate path heading
      check_cost_distance: 3.0        # [m] centerline prefix scored in the costmap
      obstacle_cost_threshold: 220.0  # cells at or above this cost count as blocked
      blocked_window_length: 0.25     # [m] local window used to group nearby high-cost cells
      minimum_blocked_length: 0.15    # [m] high-cost coverage within the local window
      minimum_mean_cost_improvement: 10.0 # accept when candidate mean is lower by this amount
      minimum_heading_improvement_deg: 5.0 # heading-error reduction required when costs are similar
      costmap_topic: "global_costmap/costmap_raw"
      treat_unknown_as_obstacle: false
      accepted_path_topic: "accepted_plan" # actual path written to FollowPath's blackboard
    
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - path_planning_bt_nodes

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


controller_server:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.3
    # MPPI's model_dt below is 0.05 s, so run the controller at 20 Hz.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 99999.3
    odom_topic: "fused_nav_ekf_odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 6000.0

    # Goal checker parameters
    simple_goal_checker:
      stateful: false #
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance_buffer: 0.0
      xy_goal_tolerance: 0.12
      # Position-only waypoint completion: do not require a final heading.
      yaw_goal_tolerance: 7.0

    # FollowPath:
    #   plugin: "nav2_rotation_shim_controller::RotationShimController"
    #   primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   angular_dist_threshold: 0.261799
    #   angular_disengage_threshold: 0.087266     # finish around 5°
    #   forward_sampling_distance: 0.5
    #   rotate_to_heading_angular_vel: 0.6
    #   max_angular_accel: 1.2
    #   simulate_ahead_time: 1.0
    #   rotate_to_goal_heading: false
    #   closed_loop: true

    #   # --- RPP ---
    #   desired_linear_vel: 0.25
    #   lookahead_dist: 0.6
    #   min_lookahead_dist: 0.3
    #   max_lookahead_dist: 0.9
    #   lookahead_time: 1.5
    #   use_velocity_scaled_lookahead_dist: true

    #   # slow down in curves
    #   use_regulated_linear_velocity_scaling: true
    #   regulated_linear_scaling_min_radius: 0.9
    #   regulated_linear_scaling_min_speed: 0.10

    #   # slow down near obstacles (uses your inflation layer)
    #   use_cost_regulated_linear_velocity_scaling: true
    #   cost_scaling_dist: 0.6
    #   cost_scaling_gain: 1.0
    #   inflation_cost_scaling_factor: 15.0   # must match local inflation_layer

    #   # turn in place when the path points away
    #   use_rotate_to_heading: true
    #   rotate_to_heading_min_angle: 0.785
    #   rotate_to_heading_angular_vel: 0.6
    #   max_angular_accel: 1.2
    #   allow_reversing: false

    #   # approach / goal
    #   min_approach_linear_velocity: 0.05
    #   approach_velocity_scaling_dist: 0.6
    #   max_robot_pose_search_dist: 5.0
    #   transform_tolerance: 0.3

    #   # safety
    #   use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0


################################################################################################
################################################################################################


    FollowPath:
      # Turn in place toward each newly received path before handing control
      # to MPPI. This is especially useful here because each waypoint is sent
      # as a separate navigation goal after the rover has stopped to pause.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.174533  # [rad] engage above approximately 10 deg
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false  # waypoint completion remains position-only
      closed_loop: true

      # MPPI path-following tuning sequence (change one group, test on the
      # rover, and keep the velocity_smoother limits in sync):
      # 1. Set the speed/acceleration limits to safe, achievable values.
      # 2. Tune PathFollowCritic for cross-track error, then PathAlignCritic
      #    for earlier steering into bends. Increase weights gradually (10-20%).
      # 3. If it still cuts corners, raise CostCritic or inflation first; do
      #    not use path critics to compensate for an unsafe costmap.
      # 4. If steering is noisy, reduce wz_std or increase temperature; if it
      #    reacts too late in turns, increase the horizon or PathAlign weight.
      # Always record critic statistics while tuning (set
      # publish_critics_stats: true) and turn visualization back off afterward.

      # Prediction horizon = time_steps * model_dt = 5.0 s. Increase it (or
      # PathAlignCritic weight) for smoother, earlier turns; decrease it if
      # the robot commits too early to a stale/noisy path. Keep model_dt equal
      # to 1/controller_frequency and preserve a practical 2-5 s horizon.
      # The rover uses Ackermann steering and must respect the same
      # velocity/acceleration envelope as velocity_smoother.
      # Humble model names are: DiffDrive, Ackermann, or Omni.
      motion_model: "Ackermann"
      AckermannConstraints:
        # This constrains MPPI only; SmacPlanner2D below has no turning-radius
        # model. Replace it with the measured physical value if necessary.
        min_turning_r: 0.01
      time_steps: 70 #3.5s horizon
      model_dt: 0.05 #DO NOT CHANGE, must be equal to 1/controller_frequency
      # More samples improve the chance of finding a smooth trajectory but
      # cost CPU. Raise batch_size only while controller updates remain timely.
      batch_size: 2000
      iteration_count: 1
      # Sampling noise: raise vx_std/wz_std when MPPI cannot explore enough
      # correction; lower them when commands weave or oscillate. Tune wz_std
      # first for lateral path error on the Ackermann rover.
      vx_std: 0.07 # 0.14
      vy_std: 0.0
      wz_std: 0.1 # 0.14
      # Kinematic bounds. These must not exceed velocity_smoother limits or
      # the real rover's capability; too-high bounds commonly cause overshoot.
      vx_max: 0.5 #0.21
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.5 #0.45
      ax_max: 1.0
      ax_min: -2.0
      az_max: 0.6 #0.35
      # Exploration selection: lower temperature selects the best-looking
      # samples more aggressively (tighter but potentially twitchy tracking);
      # raise it for smoother, less reactive commands. Change in small steps.
      temperature: 0.3
      # Control-effort penalty. Raise gamma if velocity/turn-rate commands are
      # abrupt; lower it only if MPPI is too reluctant to correct path error.
      gamma: 0.015 #0.015
      reset_period: 1.0  # Required by the Humble MPPI implementation.
      regenerate_noises: false
      visualize: false
      publish_optimal_trajectory: true
      publish_critics_stats: false

      # These critics balance progress and path tracking with the custom,
      # already-inflated local traversability costmap. Heading critics are
      # intentionally omitted because waypoint completion is position-only.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 40.0
      CostCritic:
        enabled: true
        cost_power: 1
        # Raise this to give obstacles/inflated costs priority over path
        # tracking; lower only if safe, valid paths are being rejected.
        cost_weight: 20.0 #3.81
        critical_cost: 300.0
        # Score the full local-costmap footprint against traversability costs.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 4
      GoalCritic:
        enabled: true
        cost_power: 1
        # Mainly active inside threshold_to_consider. Raise it if the rover
        # misses or drifts around waypoints; lower it if it rushes tnhe goal.
        cost_weight: 30.0 #15.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: false
        cost_power: 2 #2
        # Increase for earlier steering into upcoming curves. Too high can
        # cause corner-cutting or oscillation when the path is noisy.
        cost_weight: 35.0 #35.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # The global planner uses a 0.1 m grid; a small offset is appropriate.
        offset_from_furthest: 3 #3
        use_path_orientations: false
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 50.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.5 #30°
        mode: 1
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Primary cross-track-error weight: increase for tighter adherence to
        # the global path; decrease if it hunts side-to-side or resists safe
        # avoidance manoeuvres. Tune this before increasing PathAlignCritic.
        cost_weight: 10.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Raise to discourage reverse-like behaviour/turning away from the
        # route; lower if the rover needs more freedom in tight manoeuvres.
        cost_weight: 5.0
        threshold_to_consider: 0.5

################################################################################################
################################################################################################



