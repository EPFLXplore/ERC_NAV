local_ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    publish_tf: true
    two_d_mode: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # odom0: liorf/mapping/odometry
    # odom0_config: [true,  true,  true,      # x, y, z               (position)
    #                 true, true, true,        # roll, pitch, yaw      (orientation)
    #                 false, false, false,     # vx, vy, vz            (position velocity)
    #                 false, false, false,     # vroll, vpitch, vyaw   (rotational velocity)
    #                 false, false, false]     # ax, ay, az            (position acceleration)
    # odom0_differential: false
    # odom0_relative: false
    # odom0_queue_size: 5

    imu0: /ouster_imu
    imu0_config: [false,  false,  false,     # x, y, z               (position)
                  false, false, false,      # roll, pitch, yaw      (orientation)
                  false, false, false,       # vx, vy, vz            (position velocity)
                  true, true, true,      # vroll, vpitch, vyaw   (rotational velocity)
                  true, true, true]     # ax, ay, az            (position acceleration)

    # imu0_linear_acceleration_rejection_threshold: 10.0
    imu0_remove_gravitational_acceleration: true


