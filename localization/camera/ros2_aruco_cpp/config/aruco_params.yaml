aruco_node:
  ros__parameters:
    # camera_config_dir is intentionally NOT set here: it's supplied at launch
    # (see aruco.launch.py) as a plain-dict parameter override pointing at this
    # package's installed config/ share directory. Declaring it here too caused
    # the two sources to race, and this file's empty string was winning.
    # One entry per camera; add a new camera by dropping its JSON file in
    # config/ and appending its filename here, no code changes in multiview aruco node needed.
    camera_config_files: [
      "oak_calibration_depthai_19443010714B177E00.json",
      "oak_calibration_depthai_19443010A19E157E00.json",
      "oak_calibration_depthai_19443010816C177E00.json",
      "zed2i.json",
