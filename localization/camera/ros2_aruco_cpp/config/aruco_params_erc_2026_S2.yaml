# Shared across all nodes loaded from this file, so landmark_poses/erc_start_pos
# only need to be edited in one place.
/**:
  ros__parameters:
    erc_start_pos: [ # in the map frame
      0.0,     26.427, # S2
    ]
    backup_erc_map_yaw_rad: -2.2375 #calculated by aligning rover with vector S2->L7
    landmark_poses: [ #in the map frame
      3.183,   8.012,  # L1  
      7.269,   9.482,  # L2  
      7.878,   17.583, # L3 
      9.225,   22.389, # L4
      3.518,   23.990, # L5
      0.882,   16.870, # L6
      -3.944,  21.415, # L7
      -5.491,  16.334, # L8
      -7.695,  13.528, # L9
      -1.610,  12.602, # L10
      -7.715,  9.721,  # L11
      -4.311,  4.442,  # L12
      -5.720,  28.118, # L13
      -11.438, 5.230,  # L14
      6.483,   1.102   # L15
    ]

aruco_node:
  ros__parameters:
    # camera_config_dir is intentionally NOT set here: it's supplied at launch
    # (see aruco.launch.py) as a plain-dict parameter override pointing at this
    # package's installed config/ share directory. Declaring it here too caused
    # the two sources to race, and this file's empty string was winning.
    # One entry per camera; add a new camera by dropping its JSON file in
    # config/ and appending its filename here, no code changes in multiview aruco node needed.
    camera_config_files: [
      "oak_calibration_depthai_19443010714B177E00.json",
      "oak_calibration_depthai_19443010A19E157E00.json",
      "oak_calibration_depthai_19443010816C177E00.json",
      "zed2i.json",
    ]

lidar_phi_filter_node:
  ros__parameters: {}

pose_estimation_node_with_lidar:
  ros__parameters:
    range_sigma_m: 0.4
    bearing_sigma_deg: 1.0
